name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/usage-dashboard/package-lock.json
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python scripts/check_environment.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_sample_output.py --output-dir /tmp/sample-output --publish-dir /tmp/sample-pages
      - run: test ! -e /tmp/sample-pages/conversations.json
      - run: test -f /tmp/sample-pages/dashboard.html
      - run: test -f /tmp/sample-pages/gpt_3h_limit.html
      - run: python scripts/benchmark_large_export.py --messages 100 --report-file /tmp/benchmark-smoke.json
      - run: python src/analyze_chat_export.py --input-dir samples --output-dir /tmp/chatgpt-dashboard --timezone Asia/Tokyo --rebuild
      - run: python src/analyze_gpt_3h_limit.py --input-dir samples --output-dir /tmp/chatgpt-dashboard --timezone Asia/Tokyo --threshold 160 --window-hours 3
      - run: python scripts/patch_3h_html.py --output-dir /tmp/chatgpt-dashboard
      - run: python scripts/inject_3h_into_dashboard.py --output-dir /tmp/chatgpt-dashboard
      - run: python scripts/patch_dashboard_daily_chart.py --output-dir /tmp/chatgpt-dashboard
      - run: npm ci --ignore-scripts
        working-directory: sites/usage-dashboard
      - run: npm audit --omit=dev --audit-level=high
        working-directory: sites/usage-dashboard
      - run: npm test
        working-directory: sites/usage-dashboard
      - run: npm run lint
        working-directory: sites/usage-dashboard
