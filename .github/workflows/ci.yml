name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - run: python analyze_chat_export.py --input-dir samples --output-dir /tmp/chatgpt-dashboard --timezone Asia/Tokyo --rebuild
      - run: python analyze_gpt_3h_limit.py --input-dir samples --output-dir /tmp/chatgpt-dashboard --timezone Asia/Tokyo --threshold 160 --window-hours 3
      - run: python scripts/patch_3h_html.py --output-dir /tmp/chatgpt-dashboard
      - run: python scripts/inject_3h_into_dashboard.py --output-dir /tmp/chatgpt-dashboard
      - run: python scripts/patch_dashboard_daily_chart.py --output-dir /tmp/chatgpt-dashboard
