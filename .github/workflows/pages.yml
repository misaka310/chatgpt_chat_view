name: deploy synthetic demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python scripts/build_sample_output.py --output-dir "$RUNNER_TEMP/demo-build" --publish-dir "$RUNNER_TEMP/demo-pages"
      - run: test ! -e "$RUNNER_TEMP/demo-pages/conversations.json"
      - run: test -f "$RUNNER_TEMP/demo-pages/dashboard.html"
      - run: test -f "$RUNNER_TEMP/demo-pages/gpt_3h_limit.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/demo-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
